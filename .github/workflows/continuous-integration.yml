# Build, test and package on every push.
#
# Every push to master or a working branch produces installable packages as
# workflow artifacts (macOS arm64 + x64 dmg, Windows x64 msi/portable zip).
# Download them from the run page: Actions -> the run -> Artifacts.
# Tags named v* additionally publish a GitHub release.

name: Continuous Integration

on:
  push:
    branches: [master, "claude/**"]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_SHA: ${{ github.sha }}
  PACKAGE_PREFIX: "deskflow"
  PACKAGE_PATH: ./dist
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"

jobs:
  lint-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Checker
        uses: ./.github/actions/lint-clang

  # Lint runs alongside the builds rather than gating them, so a formatting
  # slip never costs a packaging round trip.
  main-build:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    permissions:
      contents: write
    container: ${{ matrix.target.container }}
    timeout-minutes: ${{ matrix.target.timeout }}
    strategy:
      fail-fast: false

      matrix:
        target:
          - name: "windows-2022-x64"
            runs-on: "windows-2022"
            timeout: 40
            config-args: "-G Ninja"
            vcpkg-triplet: x64-windows-release
            arch: "amd64"
            qt-version: 6.12

          - name: "macos-arm64"
            runs-on: macos-15
            timeout: 30
            qt-version: 6.12
            config-args: '-DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14 ${APPLE_CODESIGN_DEV:+-DAPPLE_CODESIGN_DEV="$APPLE_CODESIGN_DEV"}'

          - name: "macos-x64"
            runs-on: macos-15-intel
            timeout: 40
            qt-version: 6.9.3
            config-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12 -DCMAKE_OSX_SYSROOT=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk ${APPLE_CODESIGN_DEV:+-DAPPLE_CODESIGN_DEV="$APPLE_CODESIGN_DEV"}'

          # One Linux target keeps the portable code honest and runs the unit tests
          # on the platform they are developed on.
          - name: "debian-testing-x86_64"
            runs-on: ubuntu-latest
            container: debian:testing-slim
            like: "debian"
            timeout: 20
            config-args: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"
    steps:
      # Make sure the container has git before we do anything else
      - name: Install Git on Container
        if: ${{ matrix.target.container }}
        shell: bash
        run: |
          if [ "${{matrix.target.like}}" == "debian" ]; then
            apt update -qqq > /dev/null && apt install -qqq git devscripts > /dev/null
          elif [ "${{matrix.target.like}}" == "fedora" ]; then
            dnf install -y git
          elif [ "${{matrix.target.like}}" == "suse" ]; then
            zypper refresh
            zypper install -y --force-resolution git
          elif [ "${{matrix.target.like}}" == "arch" ]; then
            pacman -Syu --noconfirm git
          else
            echo "Unknown: ${{matrix.target.like}}"
          fi
      # Fancy checkout gets all the tags
      # it also makes sure we can use git --describe correctly
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      # This effectively runs `vcvarsall.bat`, etc. It's not actually installing
      # VC++ as that's already pre-installed on the Windows runner.
      - name: Setup VC++ environment
        if: ${{ runner.os == 'Windows' }}
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{matrix.target.arch}}
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{matrix.target.qt-version}}
          vcpkg-triplet: ${{matrix.target.vcpkg-triplet}}
          like: ${{ matrix.target.like }}

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Configure
        env:
          APPLE_CODESIGN_DEV: ${{ ((github.ref == 'refs/heads/master') || (contains(github.ref, '/tags/v'))) && secrets.APPLE_CODESIGN_DEV || '' }}
        run: ${{env.CMAKE_CONFIGURE}} ${{ matrix.target.config-args }} ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{env.DESKFLOW_PACKAGE_VERSION}}"

      - name: Import code-signing certificate
        if: runner.os == 'macOS' && ((github.ref == 'refs/heads/master') || (contains(github.ref, '/tags/v')))
        uses: ./.github/actions/codesign-keychain
        with:
          action: import
          apple-codesign-p12: ${{ secrets.APPLE_CODESIGN_P12 }}
          apple-codesign-p12-pwd: ${{ secrets.APPLE_CODESIGN_P12_PWD }}

      - name: Build
        shell: bash
        run: |
          if [[ "${{matrix.target.like}}" != "arch" ]]; then
            if [ "$RUNNER_OS" != "macOS" ]; then
              cmake --build build --config Release -j8 --target package
            else
              cmake --build build --config Release -j8
              packaged=false
              for i in $(seq 1 5); do
                if cmake --build build --config Release -j8 --target package; then
                  echo "Package successful"
                  packaged=true
                  break
                else
                  echo "Package attempt $i failed"
                  sleep 1
                fi
              done
              if [ "$packaged" != true ]; then
                echo "Packaging failed after $i attempts" >&2
                exit 1
              fi
            fi
          else
            cmake --build build --config Release -j8
            useradd -m build
            sudo chown -R build build
            cd build
            sudo -u build makepkg -s
            export OSNAME=$(cat /etc/os-release | grep ^ID= | sed 's/ID=//g')
            export ARCH=$(uname -m)
            mv *.pkg.tar.zst deskflow-${{env.DESKFLOW_PACKAGE_VERSION}}-${OSNAME}-${ARCH}.pkg.tar.zst
            cd ..
          fi

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && ((github.ref == 'refs/heads/master') || (contains(github.ref, '/tags/v')))
        shell: bash
        env:
          APPLE_NOTARIZE_ID: ${{ secrets.APPLE_NOTARIZE_ID }}
          APPLE_NOTARIZE_PWD: ${{ secrets.APPLE_NOTARIZE_PWD }}
          APPLE_CODESIGN_DEV: ${{ secrets.APPLE_CODESIGN_DEV }}
        run: |
          [[ "$APPLE_CODESIGN_DEV" =~ ^Developer\ ID\ Application:\ .+\ \(([A-Z0-9]+)\)$ ]]
          APPLE_NOTARIZE_TEAM="${BASH_REMATCH[1]}"
          xcrun codesign -s "${APPLE_CODESIGN_DEV}" build/deskflow[-_]*.dmg
          submission_log="${RUNNER_TEMP}/notarize.log"
          xcrun notarytool submit --apple-id "${APPLE_NOTARIZE_ID}" --password "${APPLE_NOTARIZE_PWD}" --team-id "${APPLE_NOTARIZE_TEAM}" --wait build/deskflow[-_]*.dmg | tee "${submission_log}"
          submission_id=$(grep 'id:' "${submission_log}" | tail -1 | awk '{print $2}')
          submission_status=$(grep 'status:' "${submission_log}" | tail -1 | awk '{print $2}')
          if [ "$submission_status" != "Accepted" ]; then
            xcrun notarytool log --apple-id "${APPLE_NOTARIZE_ID}" --password "${APPLE_NOTARIZE_PWD}" --team-id "${APPLE_NOTARIZE_TEAM}" "$submission_id"
            echo "Notarization failed with status: $submission_status" >&2
            exit 1
          fi
          xcrun stapler staple build/deskflow[-_]*.dmg

      - name: Clean up keychain
        if: always() && runner.os == 'macOS' && ((github.ref == 'refs/heads/master') || (contains(github.ref, '/tags/v')))
        uses: ./.github/actions/codesign-keychain
        with:
          action: cleanup

      - name: Check for unexpected repo changes
        shell: bash
        run: |
          if [[ `git status --porcelain` ]]; then
            echo "Unexpected files changed in the repo, Often caused by forgetting to commit the updated translation files"
            git status --porcelain=v1
            exit 1
          fi

      - name: Tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 2
        with:
          job: ${{ matrix.target.name }}

      - name: Test package
        uses: ./.github/actions/test-package
        with:
          like: ${{ matrix.target.like }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ matrix.target.name }}
          path: ${{github.workspace}}/build/deskflow[-_]*.*

  release:
    needs: main-build
    if: contains(github.ref, '/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Generate package checksums
        shell: bash
        run: |
          mv $GITHUB_WORKSPACE/package-*/deskflow-* .
          rm -rf $GITHUB_WORKSPACE/package-*
          sha256sum deskflow-* > sums.txt

      - name: Deploy release
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          generate_release_notes: true
          make_latest: true
          prerelease: false
          files: |
            deskflow-*
            sums.txt
