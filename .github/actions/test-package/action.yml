name: "Test Package"
description: "Installs the built package and verifies the installed binaries can run"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    - name: Test package
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          dmg=$(ls build/deskflow-*.dmg | head -1)
          echo "Y" | hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/deskflow-dmg
          /tmp/deskflow-dmg/Deskflow.app/Contents/MacOS/deskflow-core --version
          # Every Mach-O in the bundle must load on the oldest macOS we target;
          # one newer than that makes Finder refuse to open the app.
          app=/tmp/deskflow-dmg/Deskflow.app
          plutil -p "$app/Contents/Info.plist" | grep -E "LSMinimumSystemVersion|CFBundleExecutable" || true
          min=$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")
          # 12 and 12.0 are the same system; compare as three numeric fields.
          ver3() { echo "$1.0.0" | awk -F. '{printf "%05d%05d%05d", $1, $2, $3}'; }
          too_new=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            for v in $(vtool -show-build "$f" 2>/dev/null | awk '$1=="minos"{print $2} /LC_VERSION_MIN_MACOSX/{vm=1} vm&&$1=="version"{print $2;vm=0}'); do
              echo "$v  ${f#$app/}"
              if [[ "$(ver3 "$v")" > "$(ver3 "$min")" ]]; then
                echo "::error::${f#$app/} needs macOS $v, newer than LSMinimumSystemVersion $min"
                too_new=1
              fi
            done
          done < <(find "$app" -type f -print0)
          hdiutil detach /tmp/deskflow-dmg
          exit $too_new

        elif [ "$RUNNER_OS" == "Windows" ]; then
          7z x build/deskflow-*-portable.zip -otmp/deskflow-pkg
          exe=$(find tmp/deskflow-pkg -name "deskflow-core.exe" -type f | head -1)
          exe_dir=$(dirname "$exe")
          pkg_root=$(dirname "$exe_dir")
          export PATH="$exe_dir:$pkg_root:$pkg_root/lib:$PATH"
          "$exe" --version

        elif [ "$RUNNER_OS" == "Linux" ]; then
          if [ "${{inputs.like}}" == "debian" ]; then
            apt-get install -y ./build/deskflow-*.deb
          elif [ "${{inputs.like}}" == "fedora" ]; then
            dnf install -y build/deskflow-*.rpm
          elif [ "${{inputs.like}}" == "suse" ]; then
            zypper install -y --allow-unsigned-rpm build/deskflow-*.rpm
          elif [ "${{inputs.like}}" == "arch" ]; then
            pacman -U --noconfirm build/deskflow-*.pkg.tar.zst
          else
            echo "Unknown like: ${{inputs.like}}"
            exit 1
          fi
          QT_QPA_PLATFORM=minimal deskflow-core --version

        else
          echo "Unknown OS: $RUNNER_OS"
          exit 1
        fi
